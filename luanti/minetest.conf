# The Luanti server's settings. server/luanti.mjs copies this file to the volume at every start and adds what
# it must set itself (name, port, bind address, the ai_bot bridge), so edit here and deploy. Every setting:
# https://github.com/luanti-org/luanti/blob/master/minetest.conf.example

motd = Welcome! Say @Blocky in chat to talk to the server's AI.
max_users = 20
server_announce = false

# Survival with damage; set creative_mode = true for a building server.
creative_mode = false
enable_damage = true
enable_pvp = true

# Players start at spawn and keep their stuff when they die (Minetest Game's bones mod drops it otherwise).
bones_mode = keep

# New players get these privileges; GAME_ADMIN (a Fly secret) gets every privilege.
default_privs = interact, shout, home

# Keep the CPU low on a small machine.
max_block_send_distance = 8
active_block_range = 2
max_simultaneous_block_sends_per_client = 20

debug_log_level = action
